name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    name: build (macos)
    runs-on: macos-14   # Apple silicon; builds both mac arches via -arch
    steps:
      - uses: actions/checkout@v4

      - name: Build (arm64, native)
        run: make clean && make ARCH=arm64

      - name: Smoke test (arm64)
        run: |
          ./tangi --version
          ./tangi --help

      - name: Cross-compile check (x86_64)
        run: make clean && make ARCH=x86_64

  build-linux:
    name: build (linux-x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install libsystemd
        run: sudo apt-get update && sudo apt-get install -y libsystemd-dev pkg-config

      - name: Build
        run: make

      - name: Smoke test
        run: |
          ./tangi --version
          ./tangi --help
