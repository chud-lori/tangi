name: release

# Tag a version to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds a stripped binary per platform and attaches them to the GitHub
# Release, so the curl installer can pull prebuilt binaries.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    name: build (macos)
    runs-on: macos-14   # Apple silicon; cross-compiles both mac arches via -arch,
    steps:              # so the release never waits on the scarce Intel runner pool.
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build both arches
        run: |
          mkdir -p dist
          make clean && make ARCH=arm64  VERSION=${{ steps.ver.outputs.version }}
          cp tangi dist/tangi-macos-arm64
          make clean && make ARCH=x86_64 VERSION=${{ steps.ver.outputs.version }}
          cp tangi dist/tangi-macos-x86_64

      - name: Checksums
        run: cd dist && shasum -a 256 tangi-macos-* | while read -r sum f; do echo "$sum  $f" > "$f.sha256"; done

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  build-linux:
    name: build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     asset: tangi-linux-x86_64 }
          - { os: ubuntu-24.04-arm, asset: tangi-linux-arm64 }
    steps:
      - uses: actions/checkout@v4

      # Linux release binaries are built WITHOUT libsystemd so they carry no
      # shared dependency beyond libc — tangi falls back to spawning
      # `systemd-inhibit` at runtime, keeping the download portable across distros.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: make VERSION=${{ steps.ver.outputs.version }}

      - name: Stage asset + checksum
        run: |
          mkdir -p dist
          cp tangi "dist/${{ matrix.asset }}"
          cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    name: publish release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
